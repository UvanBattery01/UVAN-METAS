<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>UVAN METAS</title>
  <meta name="theme-color" content="#111111">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #151515;
    }

    .app {
      max-width: 520px;
      margin: auto;
      min-height: 100vh;
      background: #f7f7f7;
    }

    .header {
      background: #111;
      color: white;
      padding: 22px 20px 28px;
      border-radius: 0 0 25px 25px;
    }

    .brand {
      display: flex;
      justify-content: space-between;
      margin-bottom: 25px;
    }

    .brand-name {
      font-size: 21px;
      font-weight: 800;
    }

    .brand-name span {
      color: #999;
      font-weight: 500;
    }

    .month {
      color: #aaa;
      font-size: 12px;
      text-transform: uppercase;
    }

    .greeting {
      font-size: 28px;
      font-weight: 800;
    }

    .subtitle {
      color: #aaa;
      margin-top: 5px;
    }

    .content {
      padding: 18px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 3px 15px rgba(0,0,0,.06);
    }

    .title {
      font-size: 13px;
      font-weight: 800;
      color: #666;
      margin-bottom: 12px;
    }

    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: white;
      font-size: 16px;
    }

    .goal {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .circle-inner {
      width: 91px;
      height: 91px;
      background: white;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .percent {
      font-size: 25px;
      font-weight: 800;
    }

    .small {
      font-size: 11px;
      color: #777;
    }

    .numbers {
      font-size: 34px;
      font-weight: 800;
    }

    .numbers small {
      font-size: 18px;
      color: #888;
    }

    .branch {
      color: #777;
      font-size: 13px;
      margin-top: 5px;
    }

    .remaining {
      margin-top: 13px;
      font-size: 13px;
      font-weight: 700;
    }

    .progress {
      margin-top: 18px;
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #666;
      margin-bottom: 7px;
    }

    .bar {
      height: 10px;
      background: #e5e5e5;
      border-radius: 20px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: 0;
      background: #111;
      border-radius: 20px;
      transition: .3s;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat {
      background: white;
      padding: 15px 10px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.05);
    }

    .stat-label {
      font-size: 10px;
      color: #888;
      margin-bottom: 7px;
    }

    .stat-value {
      font-size: 21px;
      font-weight: 800;
    }

    .daily {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .daily-number {
      font-size: 38px;
      font-weight: 800;
    }

    .daily-text {
      color: #777;
      font-size: 13px;
      text-align: right;
      max-width: 210px;
    }

    button {
      width: 100%;
      padding: 17px;
      border: 0;
      border-radius: 15px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: 800;
    }

    .message {
      text-align: center;
      color: #777;
      font-size: 12px;
      margin-top: 10px;
    }

    .ranking {
      display: flex;
      flex-direction: column;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .position {
      width: 22px;
      color: #888;
      font-weight: 800;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #111;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
    }

    .seller {
      flex: 1;
    }

    .seller-name {
      font-size: 14px;
      font-weight: 700;
    }

    .seller-branch {
      font-size: 11px;
      color: #888;
      margin-top: 3px;
    }

    .seller-sales {
      font-size: 17px;
      font-weight: 800;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #aaa;
      font-size: 11px;
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">

    <div class="brand">
      <div class="brand-name">
        UVAN <span>METAS</span>
      </div>

      <div class="month" id="month"></div>
    </div>

    <div class="greeting">
      UVAN METAS 🔋
    </div>

    <div class="subtitle">
      Control de metas y ventas
    </div>

  </header>

  <main class="content">

    <!-- VENDEDOR -->

    <section class="card">

      <div class="title">
        VENDEDOR
      </div>

      <select id="sellerSelect"></select>

    </section>


    <!-- META -->

    <section class="card">

      <div class="title">
        META MENSUAL
      </div>

      <div class="goal">

        <div class="circle" id="circle">

          <div class="circle-inner">

            <div class="percent" id="percent">
              0%
            </div>

            <div class="small">
              cumplido
            </div>

          </div>

        </div>


        <div>

          <div class="numbers">

            <span id="sales">
              0
            </span>

            <small>
              / <span id="goal">0</span>
            </small>

          </div>

          <div class="branch" id="branch">
            Sucursal
          </div>

          <div class="remaining">

            Faltan
            <span id="remaining">0</span>
            🔋

          </div>

        </div>

      </div>


      <div class="progress">

        <div class="progress-head">

          <span>
            Avance de la meta
          </span>

          <span id="progressText">
            0 de 0
          </span>

        </div>

        <div class="bar">

          <div
            class="fill"
            id="fill">
          </div>

        </div>

      </div>

    </section>


    <!-- ESTADÍSTICAS -->

    <section class="stats">

      <div class="stat">

        <div class="stat-label">
          META SUCURSAL
        </div>

        <div
          class="stat-value"
          id="branchGoal">
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          VENTAS
        </div>

        <div
          class="stat-value"
          id="branchSales">
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          POSICIÓN
        </div>

        <div
          class="stat-value"
          id="position">
          —
        </div>

      </div>

    </section>


    <!-- RITMO -->

    <section class="card">

      <div class="title">
        TU RITMO
      </div>

      <div class="daily">

        <div
          class="daily-number"
          id="daily">
          0
        </div>

        <div class="daily-text">
          baterías por día para alcanzar tu meta.
        </div>

      </div>

    </section>


    <!-- VENTA -->

    <section class="card">

      <div class="title">
        REGISTRAR VENTA
      </div>

      <button id="saleButton">
        + REGISTRAR BATERÍA
      </button>

      <div
        class="message"
        id="message">
      </div>

    </section>


    <!-- RANKING -->

    <section class="card">

      <div class="title">
        RANKING DE VENDEDORES
      </div>

      <div
        class="ranking"
        id="ranking">
      </div>

    </section>

  </main>


  <footer>
    UVAN BATTERY · Expertos en baterías
  </footer>

</div>


<!-- DATOS DE UVAN -->

<script src="data.js"></script>


<!-- FUNCIONAMIENTO -->

<script>

const data = window.UVAN_DATA;

const sellers = [];


data.sucursales.forEach(sucursal => {

  sucursal.vendedores.forEach(vendedor => {

    sellers.push({

      nombre: vendedor.nombre,

      ventas: vendedor.ventas,

      sucursal: sucursal.nombre,

      meta: sucursal.meta

    });

  });

});


const select = document.getElementById("sellerSelect");

const month = document.getElementById("month");

const sales = document.getElementById("sales");

const goal = document.getElementById("goal");

const branch = document.getElementById("branch");

const remaining = document.getElementById("remaining");

const percent = document.getElementById("percent");

const progressText = document.getElementById("progressText");

const fill = document.getElementById("fill");

const circle = document.getElementById("circle");

const branchGoal = document.getElementById("branchGoal");

const branchSales = document.getElementById("branchSales");

const position = document.getElementById("position");

const daily = document.getElementById("daily");

const ranking = document.getElementById("ranking");

const message = document.getElementById("message");

const saleButton = document.getElementById("saleButton");


month.textContent = data.mes;


sellers.forEach((vendedor, index) => {

  const option = document.createElement("option");

  option.value = index;

  option.textContent =
    vendedor.nombre +
    " · " +
    vendedor.sucursal;

  select.appendChild(option);

});


let currentSeller = 0;


function render() {

  const vendedor = sellers[currentSeller];

  if (!vendedor) return;


  const meta = vendedor.meta;

  const ventas = vendedor.ventas;

  const porcentaje = meta
    ? Math.min(
        Math.round((ventas / meta) * 100),
        100
      )
    : 0;


  const faltan =
    Math.max(meta - ventas, 0);


  const grados =
    porcentaje * 3.6;


  sales.textContent = ventas;

  goal.textContent = meta;

  branch.textContent =
    vendedor.sucursal;

  remaining.textContent =
    faltan;

  percent.textContent =
    porcentaje + "%";

  progressText.textContent =
    ventas + " de " + meta;

  fill.style.width =
    porcentaje + "%";


  circle.style.background =
    "conic-gradient(" +
    "#111 0deg " +
    grados +
    "deg, " +
    "#e5e5e5 " +
    grados +
    "deg 360deg)";


  branchGoal.textContent =
    meta;


  const sucursal =
    data.sucursales.find(
      s => s.nombre === vendedor.sucursal
    );


  let ventasSucursal = 0;


  if (sucursal) {

    ventasSucursal =
      sucursal.vendedores.reduce(
        (total, vendedor) =>
          total +
          Number(vendedor.ventas || 0),
        0
      );

  }


  branchSales.textContent =
    ventasSucursal;


  const ordenados =
    [...sellers].sort(
      (a, b) =>
        b.ventas - a.ventas
    );


  const index =
    ordenados.findIndex(
      v =>
        v.nombre === vendedor.nombre &&
        v.sucursal === vendedor.sucursal
    );


  position.textContent =
    index >= 0
      ? "#" + (index + 1)
      : "—";


  const hoy =
    new Date();


  const ultimoDia =
    new Date(
      hoy.getFullYear(),
      hoy.getMonth() + 1,
      0
    ).getDate();


  const diasRestantes =
    Math.max(
      ultimoDia - hoy.getDate() + 1,
      1
    );


  daily.textContent =
    (faltan / diasRestantes)
      .toFixed(1);


  ranking.innerHTML = "";


  ordenados.forEach(
    (vendedor, index) => {

      const row =
        document.createElement("div");

      row.className = "row";


      row.innerHTML = `

        <div class="position">
          ${index + 1}
        </div>

        <div class="avatar">
          ${vendedor.nombre
            .substring(0,2)
            .toUpperCase()}
        </div>

        <div class="seller">

          <div class="seller-name">
            ${vendedor.nombre}
          </div>

          <div class="seller-branch">
            ${vendedor.sucursal}
          </div>

        </div>

        <div class="seller-sales">
          ${vendedor.ventas}
        </div>

      `;


      ranking.appendChild(row);

    }
  );

}


select.addEventListener(
  "change",
  function() {

    currentSeller =
      Number(this.value);

    message.textContent = "";

    render();

  }
);


saleButton.addEventListener(
  "click",
  function() {

    const vendedor =
      sellers[currentSeller];


    if (
      vendedor.ventas <
      vendedor.meta
    ) {

      vendedor.ventas++;


      message.textContent =
        "¡Venta registrada! 🔋";


      render();

    } else {

      message.textContent =
        "🎉 ¡Meta alcanzada!";

    }

  }
);


render();

</script>

</body>
</html>
